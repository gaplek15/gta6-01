<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Teluk Cahaya — Open-World Crime Game</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0e1a24; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #status, #errlog, #selftest, #ready { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

  /* --- HUD --- */
  #hud { position: fixed; inset: 0; pointer-events: none; color: #fff; }
  #hud-top-left { position: absolute; top: 14px; left: 16px; }
  #hud-money { font-size: 28px; font-weight: 800; color: #7dff9a; text-shadow: 0 2px 6px rgba(0,0,0,.7); }
  #hud-health { width: 180px; height: 12px; margin-top: 6px; background: rgba(0,0,0,.55); border: 1px solid rgba(255,255,255,.35); border-radius: 6px; overflow: hidden; }
  #hud-health-fill { height: 100%; width: 100%; background: #2ecc71; }
  #hud-xp { margin-top: 5px; font-size: 13px; color: #e8e8e8; text-shadow: 0 1px 4px rgba(0,0,0,.8); }
  #hud-top-right { position: absolute; top: 14px; right: 16px; text-align: right; }
  #hud-stars { font-size: 30px; letter-spacing: 4px; color: #ffd94d; text-shadow: 0 2px 6px rgba(0,0,0,.8); }
  #hud-clock { font-size: 16px; font-weight: 700; color: #fff; text-shadow: 0 1px 4px rgba(0,0,0,.8); }
  #hud-objective { position: absolute; left: 50%; bottom: 118px; transform: translateX(-50%); font-size: 17px; font-weight: 700; background: rgba(0,0,0,.55); border: 1px solid rgba(255,217,77,.6); border-radius: 8px; padding: 8px 16px; white-space: nowrap; }
  #hud-toast { position: absolute; left: 50%; top: 76px; transform: translateX(-50%); text-align: center; font-size: 16px; font-weight: 700; }
  #hud-toast div { background: rgba(0,0,0,.6); border-radius: 6px; padding: 5px 14px; margin-bottom: 5px; }
  #hud-dialogue { position: absolute; left: 50%; bottom: 170px; transform: translateX(-50%); width: 620px; max-width: 86vw; display: none; background: rgba(10,20,30,.82); border: 1px solid rgba(255,217,77,.5); border-radius: 10px; padding: 12px 18px; }
  #hud-dialogue-name { color: #ffd94d; font-weight: 800; font-size: 15px; margin-bottom: 4px; }
  #hud-dialogue-text { font-size: 17px; line-height: 1.45; }
  #hud-dialogue-hint { margin-top: 8px; font-size: 12px; color: #aab8c5; }
  #hud-prompt { position: absolute; left: 50%; bottom: 66px; transform: translateX(-50%); display: none; font-size: 16px; font-weight: 700; background: rgba(0,0,0,.65); border-radius: 8px; padding: 8px 16px; }
  #hud-crosshair { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); display: none; font-size: 26px; font-weight: 800; color: rgba(255,255,255,.9); text-shadow: 0 0 6px #000; }
  #hud-speed { position: absolute; right: 18px; bottom: 18px; text-align: right; display: none; text-shadow: 0 2px 6px rgba(0,0,0,.8); }
  #hud-speed b { font-size: 38px; }
  #hud-speed div { font-size: 14px; color: #ffd94d; font-weight: 700; }
  #hud-minimap { position: absolute; left: 16px; bottom: 16px; border: 2px solid rgba(255,255,255,.5); border-radius: 50%; background: rgba(20,30,40,.75); box-shadow: 0 4px 16px rgba(0,0,0,.5); }

  /* --- full screens (title / pause / busted / wasted) --- */
  #hud-screen { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; background: linear-gradient(160deg, rgba(10,30,50,.82), rgba(120,40,20,.55)); pointer-events: auto; }
  #hud-screen .panel { width: 640px; max-width: 92vw; text-align: center; background: rgba(8,18,28,.88); border: 1px solid rgba(255,217,77,.45); border-radius: 16px; padding: 30px 34px; box-shadow: 0 12px 48px rgba(0,0,0,.6); }
  #hud-screen h1 { margin: 0; font-size: 52px; letter-spacing: 4px; color: #ffd94d; text-shadow: 0 3px 0 #7a2e2e, 0 6px 18px rgba(0,0,0,.6); }
  #hud-screen h2 { margin: 6px 0 16px; font-size: 16px; letter-spacing: 3px; color: #9fd8ff; font-weight: 600; }
  #hud-screen .story { font-size: 16px; line-height: 1.55; color: #e8eef2; }
  #hud-screen .controls { text-align: left; display: inline-block; margin: 14px 0 20px; font-size: 14px; line-height: 1.9; color: #c8d4de; }
  #hud-screen button { display: block; width: 100%; margin: 8px 0; padding: 14px; font-size: 17px; font-weight: 800; letter-spacing: 1px; color: #1a1206; background: #ffd94d; border: none; border-radius: 10px; cursor: pointer; }
  #hud-screen button:hover { background: #ffe98a; }
  #hud-screen button.secondary { background: #2c3e50; color: #fff; }
  #hud-screen button.secondary:hover { background: #3d5a74; }
  #hud-screen .fine { font-size: 12px; color: #8fa2b0; margin-top: 14px; }
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.min.js" } }
</script>
</head>
<body>
<canvas id="game" aria-label="Teluk Cahaya: open-world crime game — walk, drive, missions, police"></canvas>
<div id="hud"></div>
<p id="status" role="status" aria-live="polite"></p>
<p id="errlog"></p>
<p id="selftest"></p>
<p id="ready"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
